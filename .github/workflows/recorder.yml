name: STRYK live recorder

# บันทึกจำนวนคนดูทุก 60 วิ ตลอดงาน แล้ว push ไฟล์ live.json ขึ้น branch `data`
# GitHub อาจเริ่มงานตั้งเวลาช้า/ข้าม จึงตั้งไว้ทุก 15 นาทีช่วงงาน (19:00–00:15 น.)
# ถ้ามีรอบรันอยู่แล้ว concurrency จะให้รอบใหม่รอคิว และ recorder จะจบเองเมื่อเลยเวลาจบงาน
# กด "Run workflow" เองได้ทุกเมื่อ (บันทึกต่อจากข้อมูลเดิม)
on:
  schedule:
    - cron: "*/15 12-16 17 10 *"
    - cron: "0,15 17 17 10 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recorder
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Prepare data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir data && cd data
          git init -q
          git config user.name "stryk-recorder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q origin data; then
            git checkout -q -b data FETCH_HEAD
          else
            git checkout -q --orphan data
            echo '{}' > live.json
            git add live.json
            git commit -q -m "data: init"
          fi

      - name: Record
        working-directory: data
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          CHANNELS: ../channels.json
          OUT: live.json
          GIT_PUSH: "1"
          MAX_MINUTES: "345"
        run: python3 ../recorder/record.py
